[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcetrust-guard"
version = "0.1.0"
description = "Inspectably grounded claim checking with bounded archive retrieval and uncertain lineage"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "beautifulsoup4>=4.12,<5", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
sourcetrust = "sourcetrust.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
